services:
  - type: web
    name: controlcond-homolog
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: |
      set -o errexit
      python -m pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: controlcond-homolog-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_DB_CONN_MAX_AGE
        value: "60"
      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "0"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "False"
      - key: DJANGO_LOG_LEVEL
        value: INFO

databases:
  - name: controlcond-homolog-db
    plan: free
    postgresMajorVersion: "18"
    databaseName: controlcond_homolog
    ipAllowList: []
