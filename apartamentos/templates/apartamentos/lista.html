<h1>Apartamentos</h1>

<p><a href="{% url 'apartamentos:novo' %}">Cadastrar apartamento</a></p>

<ul>
  {% for apartamento in apartamentos %}
    <li>
      {{ apartamento }}

      <a href="{% url 'apartamentos:detalhes' apartamento.id %}">
        Ver detalhes
      </a>
    </li>
  {% empty %}
    <li>Nenhum apartamento cadastrado.</li>
  {% endfor %}
</ul>
