{% extends "base_public.html" %}
{% block title %}Recuperar senha | ControlCond{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3">Recuperar senha</h1>
    <p class="text-secondary">Informe seu e-mail. Se houver uma conta válida, enviaremos as instruções.</p>
    <form method="post">{% csrf_token %}
        <label class="form-label" for="{{ form.email.id_for_label }}">E-mail</label>
        <input class="form-control mb-3" type="email" name="email" id="{{ form.email.id_for_label }}" autocomplete="email" required>
        <button class="btn btn-primary w-100" type="submit">Enviar instruções</button>
    </form>
    <a class="d-block text-center mt-3" href="{% url 'login' %}">Voltar ao login</a>
</div></div>
{% endblock %}
