{% extends "base_public.html" %}
{% block title %}Redefinir senha | ControlCond{% endblock %}
{% block content %}<div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3">Redefinir senha</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Salvar nova senha</button></form>{% else %}<div class="alert alert-danger" role="alert">Este link é inválido ou expirou.</div><a href="{% url 'password_reset' %}">Solicitar novo link</a>{% endif %}</div></div>{% endblock %}
