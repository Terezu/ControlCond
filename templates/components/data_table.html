<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                {% for cabecalho in cabecalhos %}
                    <th scope="col">
                        {{ cabecalho }}
                    </th>
                {% endfor %}
            </tr>
        </thead>

        <tbody>
            {% for linha in linhas %}
                <tr>
                    {% for valor in linha %}
                        <td>
                            {{ valor }}
                        </td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
