<div class="col-12 col-md-6 col-xl-3">
    {% if link %}
        <a
            href="{{ link }}"
            class="card card-dashboard shadow-sm h-100 dashboard-card-link text-decoration-none text-body"
        >
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-3">
                    <p class="text-secondary mb-0">
                        {{ titulo }}
                    </p>

                    {% if icone %}
                        <i class="bi {{ icone }} fs-3 {{ classe_icone|default:'text-primary' }}"></i>
                    {% endif %}
                </div>

                <p class="{{ classe_valor|default:'display-6' }} {{ classe_peso|default:'fw-bold' }} dashboard-value mb-0">
                    {{ valor }}
                </p>
            </div>

            <div class="card-footer bg-transparent">
                <span class="text-primary">
                    {{ texto_link|default:"Abrir módulo" }}
                    <i class="bi bi-arrow-right ms-1"></i>
                </span>
            </div>
        </a>
    {% else %}
        <div class="card card-dashboard shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-3">
                    <p class="text-secondary mb-0">
                        {{ titulo }}
                    </p>

                    {% if icone %}
                        <i class="bi {{ icone }} fs-3 {{ classe_icone|default:'text-primary' }}"></i>
                    {% endif %}
                </div>

                <p class="{{ classe_valor|default:'display-6' }} {{ classe_peso|default:'fw-bold' }} dashboard-value mb-0">
                    {{ valor }}
                </p>
            </div>

            {% if rodape %}
                <div class="card-footer bg-transparent text-secondary">
                    {{ rodape }}
                </div>
            {% endif %}
        </div>
    {% endif %}
</div>
