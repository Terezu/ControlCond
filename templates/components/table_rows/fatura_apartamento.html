<tr class="clickable-row">
    <td>
        <a href="{% url 'faturas:detalhes' linha.id %}" class="stretched-link text-reset text-decoration-none fw-semibold">
            {{ linha.mes|stringformat:"02d" }}/{{ linha.ano }}
        </a>
    </td>
    <td>{{ linha.consumo_agua }}</td>
    <td>{{ linha.consumo_gas }}</td>
    <td class="fw-semibold">R$ {{ linha.valor_total|floatformat:2 }}</td>
    <td>{% include "components/status_badge.html" with status=linha.status texto=linha.get_status_display %}</td>
    <td class="text-end">
        <span class="text-primary" aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
    </td>
</tr>
