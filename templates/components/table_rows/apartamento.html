<tr class="clickable-row">
    <td>
        <a href="{% url 'apartamentos:detalhes' linha.id %}" class="stretched-link text-reset text-decoration-none fw-semibold">
            Apartamento {{ linha.numero }}
        </a>
    </td>
    <td>{{ linha.bloco|default:"—" }}</td>
    <td>{{ linha.leitura_base_agua|default_if_none:"Não informada" }}</td>
    <td>{{ linha.leitura_base_gas|default_if_none:"Não informada" }}</td>
    <td class="text-end">
        <span class="text-primary" aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
    </td>
</tr>
