{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            {{ nome_sistema }}
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
    rel="stylesheet"
    href="{% static 'css/style.css' %}?v=20260724-dashboard"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a
            class="navbar-brand fw-bold"
            href="{% url 'dashboard:inicio' %}"
        >
            ControlCond
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="menuPrincipal"
        >
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a
                        class="nav-link{% if request.resolver_match.namespace == 'dashboard' %} active{% endif %}"
                        href="{% url 'dashboard:inicio' %}"
                        {% if request.resolver_match.namespace == 'dashboard' %}aria-current="page"{% endif %}
                    >
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link{% if request.resolver_match.namespace == 'apartamentos' %} active{% endif %}"
                        href="{% url 'apartamentos:lista' %}"
                        {% if request.resolver_match.namespace == 'apartamentos' %}aria-current="page"{% endif %}
                    >
                        Apartamentos
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link{% if request.resolver_match.namespace == 'leituras' %} active{% endif %}"
                        href="{% url 'leituras:lista' %}"
                        {% if request.resolver_match.namespace == 'leituras' %}aria-current="page"{% endif %}
                    >
                        Leituras
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link{% if request.resolver_match.namespace == 'faturas' %} active{% endif %}"
                        href="{% url 'faturas:lista' %}"
                        {% if request.resolver_match.namespace == 'faturas' %}aria-current="page"{% endif %}
                    >
                        Faturas
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link{% if request.resolver_match.namespace == 'configuracoes' %} active{% endif %}"
                        href="{% url 'configuracoes:detalhes' %}"
                        {% if request.resolver_match.namespace == 'configuracoes' %}aria-current="page"{% endif %}
                    >
                        Configurações
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% if messages %}
        {% for message in messages %}
            <div
                class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                role="alert"
            >
                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Fechar"
                ></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</main>

<footer class="border-top bg-white py-3 mt-5">
    <div class="container text-center text-secondary">
        <small>{{ nome_sistema }}</small>
    </div>
</footer>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>

</body>
</html>
