<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerar fatura</title>
</head>
<body>
    <h1>Gerar fatura</h1>

    <p>
        Selecione uma leitura para calcular e cadastrar sua respectiva fatura.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Gerar fatura
        </button>

        <a href="{% url 'faturas:lista' %}">
            Cancelar
        </a>
    </form>
</body>
</html>
